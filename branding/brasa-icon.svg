<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Ícone da Brasa: o prompt ❯ aceso como brasa, com a faísca do cursor -->
  <defs>
    <radialGradient id="fundo" cx="0.5" cy="0.8" r="0.8">
      <stop offset="0" stop-color="#5e2b1e"/>
      <stop offset="0.5" stop-color="#26161a"/>
      <stop offset="1" stop-color="#141114"/>
    </radialGradient>
    <linearGradient id="brasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9b3"/>
      <stop offset="0.45" stop-color="#f59a74"/>
      <stop offset="1" stop-color="#cf5a42"/>
    </linearGradient>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fundo)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#5a3128" stroke-width="2"/>
  <path d="M154 166 L290 266 L154 366" fill="none" stroke="url(#brasa)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" filter="url(#brilho)"/>
  <circle cx="352" cy="352" r="20" fill="#ffd9b3" filter="url(#brilho)"/>
</svg>
