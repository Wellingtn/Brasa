<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a262c"/><stop offset="1" stop-color="#141316"/></linearGradient>
    <radialGradient id="gB" cx="0.5" cy="0.78" r="0.75"><stop offset="0" stop-color="#5a2a1f"/><stop offset="0.55" stop-color="#24161a"/><stop offset="1" stop-color="#141114"/></radialGradient>
    <linearGradient id="emb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd2a8"/><stop offset="0.5" stop-color="#f29a76"/><stop offset="1" stop-color="#d4634a"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262a2f"/><stop offset="1" stop-color="#17191c"/></linearGradient>
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
  </defs>
  <rect width="1500" height="640" fill="#0f0e10"/>

  <!-- A: Oxiterm -->
  <g transform="translate(122,70)">
    <rect width="256" height="256" rx="58" fill="url(#gA)"/>
    <rect x="0.5" y="0.5" width="255" height="255" rx="57.5" fill="none" stroke="#3d383a"/>
    <!-- ponta de folha dobrada (as notas) -->
    <path d="M196 0 H198 Q256 0 256 58 V60 Z" fill="#3a3436"/>
    <path d="M196 0 L256 60 L208 60 Q196 60 196 48 Z" fill="#4a4346"/>
    <!-- prompt e cursor -->
    <path d="M70 92 L132 138 L70 184" fill="none" stroke="#e0866e" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="148" y="168" width="44" height="18" rx="5" fill="#b3a6f4"/>
    <text x="128" y="372" font-family="Fira Sans" font-weight="600" font-size="44" fill="#ece8e6" text-anchor="middle" letter-spacing="1">oxiterm</text>
    <text x="128" y="408" font-family="Fira Sans" font-size="18" fill="#9a9497" text-anchor="middle">terminal, notas e sessões</text>
    <text x="128" y="470" font-family="Fira Sans" font-size="15" fill="#6b6568" text-anchor="middle">óxido (Rust) + term</text>
  </g>

  <!-- B: Brasa -->
  <g transform="translate(622,70)">
    <rect width="256" height="256" rx="58" fill="url(#gB)"/>
    <rect x="0.5" y="0.5" width="255" height="255" rx="57.5" fill="none" stroke="#4a2c26"/>
    <path d="M78 86 L146 136 L78 186" fill="none" stroke="url(#emb)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="176" cy="178" r="9" fill="#ffd2a8" filter="url(#glow)"/>
    <text x="128" y="372" font-family="Fira Sans" font-weight="700" font-size="46" fill="#f2b394" text-anchor="middle" letter-spacing="2">brasa</text>
    <text x="128" y="408" font-family="Fira Sans" font-size="18" fill="#9a9497" text-anchor="middle">o terminal aceso</text>
    <text x="128" y="470" font-family="Fira Sans" font-size="15" fill="#6b6568" text-anchor="middle">a cor coral do app, viva</text>
  </g>

  <!-- C: Ardósia -->
  <g transform="translate(1122,70)">
    <rect width="256" height="256" rx="58" fill="url(#gC)"/>
    <rect x="0.5" y="0.5" width="255" height="255" rx="57.5" fill="none" stroke="#353a40"/>
    <!-- pauta da lousa / caderno -->
    <g stroke="#2e3338" stroke-width="2"><line x1="36" y1="76" x2="220" y2="76"/><line x1="36" y1="118" x2="220" y2="118"/><line x1="36" y1="160" x2="220" y2="160"/><line x1="36" y1="202" x2="220" y2="202"/></g>
    <g filter="url(#chalk)" fill="none" stroke="#c9bff7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M66 98 L120 132 L66 166" stroke-width="16"/>
      <path d="M136 172 L192 172" stroke-width="15"/>
    </g>
    <text x="128" y="372" font-family="Fira Sans" font-weight="600" font-size="44" fill="#ece8e6" text-anchor="middle" letter-spacing="1">ardósia</text>
    <text x="128" y="408" font-family="Fira Sans" font-size="18" fill="#9a9497" text-anchor="middle">escreva, rode, apague</text>
    <text x="128" y="470" font-family="Fira Sans" font-size="15" fill="#6b6568" text-anchor="middle">a lousa grafite: terminal + caderno</text>
  </g>

  <text x="750" y="610" font-family="Fira Sans" font-size="15" fill="#4f4a4d" text-anchor="middle">Conceitos de nome e ícone — escolha um, ou misture (ex.: nome de um, ícone de outro)</text>
</svg>
