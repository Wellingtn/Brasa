[package]
name = "brasa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal em blocos com notas executáveis, gerenciador de arquivos e monitor de desempenho"

[dependencies]
gpui = "0.2.2"
alacritty_terminal = "0.26"
dirs.workspace = true
async-channel = "2"
ox-pty = { path = "../../crates/ox-pty" }
ox-markdown = { path = "../../crates/ox-markdown" }
ox-files = { path = "../../crates/ox-files" }
ox-suggest = { path = "../../crates/ox-suggest" }
ox-editor = { path = "../../crates/ox-editor" }
ox-graphics = { path = "../../crates/ox-graphics" }
ox-db = { path = "../../crates/ox-db" }
# o mesmo `image` do GPUI: as imagens do terminal viram quadros dele
image = { version = "0.25", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[package.metadata.deb]
maintainer = "Wellingtn <noreply@github.com>"
name = "brasa"
section = "utils"
priority = "optional"
depends = "$auto, libvulkan1"
recommends = "mesa-vulkan-drivers"
extended-description = "Brasa é um terminal para Linux em que cada comando vira um bloco, com notas em Markdown que executam, gerenciador de arquivos e monitor de CPU, memória e processos."
assets = [
    ["target/release/brasa", "usr/bin/brasa", "755"],
    ["../../packaging/brasa.desktop", "usr/share/applications/brasa.desktop", "644"],
    ["../../branding/icons/brasa-48.png", "usr/share/icons/hicolor/48x48/apps/brasa.png", "644"],
    ["../../branding/icons/brasa-128.png", "usr/share/icons/hicolor/128x128/apps/brasa.png", "644"],
    ["../../branding/icons/brasa-256.png", "usr/share/icons/hicolor/256x256/apps/brasa.png", "644"],
    ["../../branding/icons/brasa-512.png", "usr/share/icons/hicolor/512x512/apps/brasa.png", "644"],
]

[package.metadata.generate-rpm]
name = "brasa"
summary = "Terminal em blocos com notas executáveis"
assets = [
    { source = "../../target/release/brasa", dest = "/usr/bin/brasa", mode = "755" },
    { source = "../../packaging/brasa.desktop", dest = "/usr/share/applications/brasa.desktop", mode = "644" },
    { source = "../../branding/icons/brasa-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/brasa.png", mode = "644" },
    { source = "../../branding/icons/brasa-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/brasa.png", mode = "644" },
    { source = "../../branding/icons/brasa-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/brasa.png", mode = "644" },
    { source = "../../branding/icons/brasa-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/brasa.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
